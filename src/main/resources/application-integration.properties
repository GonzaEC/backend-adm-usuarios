# src/test/resources/application-integration.properties
# Perfil pesado: tests de integracion contra Postgres real en Docker.
# Requiere Docker instalado y corriendo.
# La URL es un placeholder: Testcontainers la sobreescribe en runtime
# via @DynamicPropertySource en la clase base de integración.

# ===== DataSource =====
# Este valor es sobreescrito por AbstractIntegrationTest.@DynamicPropertySource
spring.datasource.url=jdbc:postgresql://localhost:5432/placeholder
spring.datasource.username=test
spring.datasource.password=test
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA =====
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Flyway =====
# Habilitado: aplica las migraciones reales sobre el contenedor Postgres.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=false

# ===== Security =====
app.seed-admin=false