# src/test/resources/application-integration.properties
# ──────────────────────────────────────────────────────────────────────────────
# Perfil "integration" → tests @Tag("integration")
#
# Activo con: mvn test -Pintegration
#
# Prerequisito: levantar Postgres con `docker compose up -d` antes de correr.
#
# Características:
#   - Postgres real corriendo en localhost (docker-compose).
#   - Flyway aplica las migraciones reales al arrancar el contexto Spring.
#   - @Transactional en AbstractIntegrationTest hace rollback después de cada
#     test → la DB queda limpia sin necesidad de resetear el contenedor.
# ──────────────────────────────────────────────────────────────────────────────

# ===== DataSource → postgres del docker-compose =====
spring.datasource.url=jdbc:postgresql://localhost:5432/sip_project
spring.datasource.username=dev_user
spring.datasource.password=dev_password
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# validate: Hibernate NO toca el esquema; Flyway es el único dueño del DDL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Flyway =====
# Aplica src/main/resources/db/migration sobre el Postgres local al arrancar.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=false

# ===== Security =====
# No sembrar admin automáticamente; los tests crean sus propios datos.
app.seed-admin=false

# ===== Servidor =====
server.port=0