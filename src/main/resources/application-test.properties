# src/test/resources/application-test.properties
# Perfil liviano: tests de dominio y de servicio con mocks.
# No necesita Docker ni Postgres instalado.
# H2 en modo PostgreSQL-compatible para acercarse al dialecto real.

# ===== DataSource =====
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===== JPA =====
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Flyway =====
# Deshabilitado: con ddl-auto=create-drop, Hibernate genera el esquema.
# Flyway en H2 suele tener problemas con SQL especifico de Postgres (BIGSERIAL, etc.)
spring.flyway.enabled=false

# ===== Security =====
# Desactiva el seed de admin para no necesitar datos reales
app.seed-admin=false